<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Погода</title>
    <link rel="stylesheet" href="style5.css">
</head>
<body>
<div class="scene">
    <div class="card">
        <div class="temp">17</div>
    </div>

    <div class="cloud"></div>

    <div class="arrows">
        <span>&larr;</span>
        <span>&rarr;</span>
    </div>

    <div class="forecast">
        <div class="day"><small>Mon</small>17°</div>
        <div class="day"><small>Tue</small>19°</div>
        <div class="day"><small>Wed</small>16°</div>
        <div class="day"><small>Thu</small>18°</div>
        <div class="day"><small>Fri</small>21°</div>
    </div>
</div>
</body>
</html>
