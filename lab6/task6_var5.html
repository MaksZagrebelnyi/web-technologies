<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Попап</title>
    <link rel="stylesheet" href="style46.css">
</head>
<body>
<header class="header">
    <a class="header-link" href="#">Mail</a>
    <a class="header-link" href="#">Images</a>

    <div class="menu">
        <!-- кнопка попапу: сам чекбокс, тому він фокусується клавішею Tab -->
        <input class="popup-button" type="checkbox" id="popup-toggle" aria-label="Відкрити меню додатків">

        <div class="popup">
            <!-- прокручуваний контейнер -->
            <div class="popup-body" tabindex="0">
                <div class="apps">
                    <a class="app" href="#"><span class="app-icon">📅</span>Calendar</a>
                    <a class="app" href="#"><span class="app-icon">✉️</span>Mail</a>
                    <a class="app" href="#"><span class="app-icon">📰</span>News</a>
                    <a class="app" href="#"><span class="app-icon">🗺️</span>Map</a>
                    <a class="app" href="#"><span class="app-icon">📁</span>Files</a>
                    <a class="app" href="#"><span class="app-icon">👤</span>Contacts</a>
                    <a class="app" href="#"><span class="app-icon">🌐</span>Translate</a>
                    <a class="app" href="#"><span class="app-icon">▶️</span>Videos</a>
                    <a class="app" href="#"><span class="app-icon">🔍</span>Search</a>
                    <a class="app" href="#"><span class="app-icon">👥</span>Photos</a>
                    <a class="app" href="#"><span class="app-icon">🎨</span>Apps</a>
                    <a class="app" href="#"><span class="app-icon">📄</span>Documents</a>
                </div>

                <!-- додаткові іконки, з'являються після натискання More -->
                <div class="apps apps-extra">
                    <a class="app" href="#"><span class="app-icon">💬</span>Chat</a>
                    <a class="app" href="#"><span class="app-icon">🎓</span>Classroom</a>
                    <a class="app" href="#"><span class="app-icon">⭐</span>Collection</a>
                    <a class="app" href="#"><span class="app-icon">🔴</span>Mars</a>
                    <a class="app" href="#"><span class="app-icon">📝</span>Blogs</a>
                    <a class="app" href="#"><span class="app-icon">📣</span>Promos</a>
                    <a class="even-more" href="#">Even more from Kottans</a>
                </div>
            </div>

            <!-- чекбокс More: прихований, але фокусований; label працює як кнопка -->
            <input class="more-toggle" type="checkbox" id="more-toggle">
            <label class="more-button" for="more-toggle">More</label>
        </div>
    </div>

    <a class="header-link" href="#">🔔</a>
    <a class="avatar" href="#" aria-label="Профіль"></a>
</header>
</body>
</html>
